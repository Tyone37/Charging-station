name: CI and delivery

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Start MySQL and verify service accounts
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 180 mysql
          for schema in identity operations billing; do
            docker compose exec -T mysql env "MYSQL_PWD=local_${schema}_only" \
              mysql --protocol=TCP -h 127.0.0.1 -u "${schema}_app" \
              --database "$schema" -e 'SELECT 1'
          done

      - uses: actions/setup-node@v7
        if: hashFiles('**/package.json') != ''
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test and build Node projects
        if: hashFiles('**/package.json') != ''
        run: |
          while IFS= read -r -d '' manifest; do
            project="$(dirname "$manifest")"
            echo "Testing Node project: $project"
            (
              cd "$project"
              npm ci
              npm test
              npm run build --if-present
            )
          done < <(git ls-files -z -- ':(glob)**/package.json')

      - uses: actions/setup-java@v6
        if: hashFiles('**/pom.xml') != ''
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Maven projects
        if: hashFiles('**/pom.xml') != ''
        run: |
          while IFS= read -r -d '' manifest; do
            project="$(dirname "$manifest")"
            echo "Verifying Maven project: $project"
            (
              cd "$project"
              bash ./mvnw --batch-mode verify
            )
          done < <(git ls-files -z -- ':(glob)**/pom.xml')

      - name: Note bootstrap coverage
        if: hashFiles('**/package.json', '**/pom.xml') == ''
        run: echo 'No Node or Maven project yet. This run checks MySQL bootstrap only.' >> "$GITHUB_STEP_SUMMARY"

      - name: Show MySQL logs on failure
        if: failure()
        run: docker compose logs mysql

      - name: Remove test database
        if: always()
        run: docker compose down --volumes

  delivery:
    name: Package source
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Archive the verified commit
        run: |
          archive="charging-station-$GITHUB_SHA.tar.gz"
          git archive --format=tar.gz --prefix=charging-station/ \
            --output="$RUNNER_TEMP/$archive" "$GITHUB_SHA"
          cd "$RUNNER_TEMP"
          sha256sum "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: charging-station-${{ github.sha }}
          path: |
            ${{ runner.temp }}/charging-station-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/charging-station-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
